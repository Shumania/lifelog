<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — Hero + Two Drawers (p3.35 candidate, Rev 4.2)</title>
<style>
  :root {
    --bg: #0a0e1a; --panel: #111827; --panel2: #182236;
    --text: #e5e9f2; --text-dim: #7a8599; --accent: #34d399; --accent2: #6ee7b7;
    --warn: #fbbf24; --moon: #93a7d1; --border: #232d42;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .phone { max-width: 430px; margin: 24px auto; border: 1px solid var(--border);
           border-radius: 18px; overflow: hidden; background: var(--bg);
           box-shadow: 0 8px 40px rgba(0,0,0,.5); }

  /* ---- app header ---- */
  .hdr { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px;
         border-bottom: 1px solid var(--border); }
  .hdr .logo { font-size: 16px; font-weight: 700; }
  .vchips { margin-left: auto; display: flex; gap: 6px; font-size: 10px; color: var(--text-dim); }
  .vchips span { background: var(--panel); padding: 2px 6px; border-radius: 8px; }

  .houserow { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--border);
           border-radius: 8px; padding: 5px 8px; font-size: 13px; }
  select.other-playing { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(52,211,153,.35); }
  .gear { margin-left: auto; color: var(--text-dim); }

  /* ---- HERO ---- */
  .hero { margin: 6px 12px 10px; border: 1px solid var(--border); border-radius: 14px;
          background: linear-gradient(180deg, #14203a, #101827); padding: 14px 14px 12px; }
  .hero.playing { border-color: rgba(52,211,153,.5); }
  .hero-where { font-size: 12px; color: var(--accent2); font-weight: 650; letter-spacing: .02em; }
  .hero-state { float: right; font-size: 11px; color: var(--text-dim); }
  .hero-track { font-size: 19px; font-weight: 700; margin-top: 6px; line-height: 1.25; }
  .hero-artist { font-size: 14px; color: var(--text-dim); margin-top: 2px; }
  .hero-sub { font-size: 11px; color: var(--text-dim); margin-top: 8px; }
  .hero.quiet .hero-track { color: var(--text-dim); font-weight: 500; font-size: 16px; }
  .hero.stale { border-color: rgba(251,191,36,.55); }
  .hero.stale .hero-state { color: var(--warn); }
  .hero.stale .hero-track { font-size: 15px; font-weight: 500; font-style: italic; }
  .hero.moon { border-color: rgba(147,167,209,.5); }
  .hero.moon .hero-state { color: var(--moon); }
  .hero.moon .hero-track { font-size: 15px; font-weight: 500; font-style: italic; color: var(--moon); }
  .hero-controls { display: flex; gap: 18px; margin-top: 10px; font-size: 17px; color: var(--text-dim); }

  /* ---- drawers (shared shell for Speakers&Queue + Elsewhere) ---- */
  .dw { margin: 0 12px 10px; border-radius: 10px; background: var(--panel);
        border: 1px solid var(--border); overflow: hidden; }
  .dw-bar { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; }
  .dw-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
              color: var(--text-dim); flex: none; }
  .dw-sum { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; flex: 1; }
  .dw-sum b { color: var(--text); font-weight: 550; }
  .dw-sum .seg-play { color: var(--accent2); }
  .dw-sum .seg-warn { color: var(--warn); }
  .dw-sum .seg-moon { color: var(--moon); }
  .dw-caret { color: var(--text-dim); font-size: 11px; flex: none; transition: transform .15s; }
  .dw.open .dw-caret { transform: rotate(180deg); }
  .dw-detail { display: none; border-top: 1px solid var(--border); }
  .dw.open .dw-detail { display: block; }

  /* speakers & queue drawer innards */
  .dw-sec { padding: 8px 10px 10px; }
  .dw-sec + .dw-sec { border-top: 1px solid var(--border); }
  .dw-h { font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
          color: var(--text-dim); margin: 2px 0 7px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 9px; }
  .chip { font-size: 11px; padding: 4px 9px; border-radius: 13px; background: var(--panel2);
          border: 1px solid var(--border); color: var(--text-dim); }
  .chip.on { background: #12301f; border-color: var(--accent); color: var(--accent2); }
  .volrow { display: flex; align-items: center; gap: 9px; font-size: 12px; padding: 3px 0; }
  .volrow .vr-name { flex: 1; }
  .volrow .vr-bar { flex: 1.4; height: 4px; background: var(--panel2); border-radius: 2px; position: relative; }
  .volrow .vr-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent);
                     border-radius: 2px; opacity: .65; }
  .volrow .vr-n { width: 22px; text-align: right; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .nudge { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--text-dim); margin-top: 8px; }
  .nudge button { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
                  border-radius: 8px; padding: 2px 11px; font-size: 12px; }
  .nudge .grp { margin-left: auto; color: var(--accent2); }
  .qrow { display: flex; gap: 8px; font-size: 12px; padding: 3px 0; color: var(--text-dim); }
  .qrow.now { color: var(--accent2); }
  .qrow .qn { width: 16px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
  .qempty { font-size: 12px; color: var(--text-dim); font-style: italic; }

  /* elsewhere detail rows */
  .ew-line { display: flex; align-items: center; gap: 9px; padding: 8px 10px; cursor: pointer; }
  .ew-line:hover { background: var(--panel2); }
  .ew-line + .ew-line { border-top: 1px solid rgba(35,45,66,.55); }
  .ew-icon { font-size: 13px; width: 16px; text-align: center; flex: none; }
  .ew-play { color: var(--accent); }
  .ew-main { min-width: 0; flex: 1; }
  .ew-where { font-size: 12px; font-weight: 650; }
  .ew-where .house { color: var(--accent2); }
  .ew-track { font-size: 12px; color: var(--text-dim); white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; }
  .ew-track b { color: var(--text); font-weight: 550; }
  .ew-stale .ew-where, .ew-stale .ew-icon { color: var(--warn); }
  .ew-stale .ew-track { font-style: italic; }
  .ew-stale { cursor: default; }
  .ew-moon .ew-where, .ew-moon .ew-icon { color: var(--moon); }
  .ew-moon .ew-track { font-style: italic; }
  .ew-moon { cursor: default; }
  .ew-go { color: var(--text-dim); font-size: 12px; flex: none; }

  .body-hint { padding: 18px 12px 28px; text-align: center; color: var(--text-dim); font-size: 12px; }

  /* ---- scenario switcher (mock chrome only) ---- */
  .scenarios { max-width: 430px; margin: 0 auto 40px; padding: 0 4px; }
  .scenarios h3 { font-size: 13px; color: var(--text-dim); font-weight: 600; margin: 18px 8px 8px; }
  .sc-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .sc-btns button { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
                    border-radius: 10px; padding: 8px 12px; font-size: 12px; cursor: pointer; }
  .sc-btns button.active { border-color: var(--accent); color: var(--accent2); }
  .sc-note { margin: 10px 8px 0; font-size: 12px; color: var(--text-dim); min-height: 64px; white-space: pre-line; }
</style>
</head>
<body>

<div class="phone">
  <div class="hdr">
    <span class="logo">🎵 Listening Log</span>
    <div class="vchips"><span>Mind v2.67.0</span><span>ShumaFrame v2.67.0</span><span>p3.35</span></div>
  </div>

  <div class="houserow">
    <select id="housesel"><option>🏝 Vashon</option><option>🏠 Cap Hill</option><option>📱 Roaming</option></select>
    <span class="gear">⚙</span>
  </div>

  <div class="hero" id="hero"></div>
  <div class="dw" id="hdw"></div>
  <div class="dw" id="elw"></div>

  <div class="body-hint">… rest of page unchanged (History, Playlists, Shortcuts) …</div>
</div>

<div class="scenarios">
  <h3>Mock scenarios — tap to preview, then flip the house selector</h3>
  <div class="sc-btns" id="btns"></div>
  <div class="sc-note" id="note"></div>
</div>

<script>
const SCENARIOS = {
  "Both houses playing": {
    note: "Happy path: your group is the hero; every other group collapses into the Elsewhere drawer.",
    lines: [
      { icon: "▶", cls: "", house: "Cap Hill", rooms: "Main Floor ×5", track: "<b>Whole Lotta Love</b> — Led Zeppelin", go: "›",
        queue: ["Whole Lotta Love — Led Zeppelin", "What Is and What Should Never Be", "The Lemon Song", "Thank You"] },
      { icon: "▶", cls: "", house: "Vashon", rooms: "Shed Arc", track: "<b>KEXP 90.3</b> · live stream", go: "›", stream: true }
    ]
  },
  "Both houses, multi-zone": {
    note: "Busiest realistic case: two groups per house. Your group = hero. The OTHER group in your own house joins Elsewhere too — 'elsewhere' means every group that isn't yours, same house or not.",
    lines: [
      { icon: "▶", cls: "", house: "Cap Hill", rooms: "Main Floor ×3", track: "<b>La Femme d'Argent</b> — Air", go: "›",
        queue: ["La Femme d'Argent — Air", "Sexy Boy", "All I Need", "Kelly Watch the Stars"] },
      { icon: "▶", cls: "", house: "Cap Hill", rooms: "Master Suite ×2", track: "♪ playing", go: "›" },
      { icon: "▶", cls: "", house: "Vashon", rooms: "Shed Arc +1", track: "<b>El Espanto</b> — Balún", go: "›",
        queue: ["El Espanto — Balún", "Vaivén", "La Nueva Ciudad", "Reflejo"] },
      { icon: "▶", cls: "", house: "Vashon", rooms: "Garage", track: "♪ playing", go: "›" }
    ]
  },
  "One group, one house": {
    note: "Most common case. If it's YOUR group: hero + drawers, no Elsewhere at all. If it's the other house: quiet hero + one Elsewhere line.",
    lines: [
      { icon: "▶", cls: "", house: "Vashon", rooms: "Garage", track: "<b>El Espanto</b> — Balún", go: "›",
        queue: ["El Espanto — Balún", "Teléfono", "Años Atrás"] }
    ]
  },
  "Garbage title (E5)": {
    note: "E5: Sonos sometimes reports junk metadata (\"? — ?\"). Renders as ♪ playing rather than asserting nonsense. Queue unknown → honest em-dash empty state, never another room's queue.",
    lines: [
      { icon: "▶", cls: "", house: "Cap Hill", rooms: "Basement Study", track: "♪ playing", go: "›" }
    ]
  },
  "Stale: track overdue (⚠)": {
    note: "E1+D6b: staleness judged by STATE, not a heartbeat clock. A playing track has a known length — long past its end with no event = ⚠. Viewing the stale house → warning takes over the hero (past tense). Otherwise it's a compact ⚠ segment in Elsewhere.",
    lines: [
      { icon: "▶", cls: "", house: "Cap Hill", rooms: "Backyard", track: "<b>Harvest Moon</b> — Neil Young", go: "›",
        queue: ["Harvest Moon — Neil Young", "Unknown Legend", "From Hank to Hendrix"] },
      { icon: "⚠", cls: "ew-stale", house: "Vashon", rooms: "last seen 72m ago", track: "was playing: Shed Arc — Balún \u201cEl Espanto\u201d · track ended ~55m ago, no update since", go: "" }
    ]
  },
  "Long stream, aging honestly": {
    note: "A stream can play for hours with zero events — silence is NOT suspicious, no ⚠. Past ~30 min the display carries an as-of stamp. Streams have no queue — the drawer says so instead of pretending.",
    lines: [
      { icon: "▶", cls: "", house: "Vashon", rooms: "Shed Arc", track: "<b>KEXP 90.3</b> · live stream · as of 43m ago", go: "›", stream: true }
    ]
  },
  "Quiet hours (countdown)": {
    note: "Machines sleep 10 PM–7 AM by design — 🌙, not ⚠. The 7 AM wake is scheduled, so this is the one honest countdown.",
    lines: [
      { icon: "🌙", cls: "ew-moon", house: "Vashon", rooms: "sleeping (quiet hours)", track: "last seen 11:58 PM: all quiet · next check-in ~7:00 AM (in 4h 12m)", go: "" }
    ]
  },
  "All quiet": {
    note: "Hero says so plainly; Speakers & Queue drawer still works (your selection, honest empty queue); no Elsewhere drawer at all.",
    lines: []
  }
};

const hero = document.getElementById('hero'), hdw = document.getElementById('hdw'),
      elw = document.getElementById('elw'), btns = document.getElementById('btns'),
      note = document.getElementById('note'), housesel = document.getElementById('housesel');
let currentScenario = "Both houses playing";
let elwOpen = false, hdwOpen = false;
let heroPick = null;

function pickGroup(house, rooms) {
  // Selecting an elsewhere row = make that the active house + speaker group.
  // View/selection change ONLY — never touches audio (same rule as geo/house switching).
  housesel.value = house === "Vashon" ? "🏝 Vashon" : "🏠 Cap Hill";
  heroPick = rooms;
  elwOpen = false;
  render(currentScenario);
}

function selectedHouse() {
  const v = housesel.value;
  if (v.includes("Vashon")) return "Vashon";
  if (v.includes("Cap Hill")) return "Cap Hill";
  return "Roaming";
}

const HOUSE_ROOMS = {
  "Vashon": [["Maury",18],["Green Kitchen Move",18],["Sonos Move",18],["Garage",30],["Shed Arc",18],["Shed Boombox",18],["Sauna Porch",35],["Main Lower Deck",39]],
  "Cap Hill": [["Living Room",9],["Dining Room",9],["Kitchen",9],["Master Bedroom",12],["Master Bathroom",18],["Basement Study",12],["Media Room",7],["Backyard",18]]
};
const GROUP_MEMBERS = {
  "Main Floor ×5": ["Living Room","Dining Room","Kitchen","Media Room","Backyard"],
  "Main Floor ×3": ["Living Room","Dining Room","Kitchen"],
  "Master Suite ×2": ["Master Bedroom","Master Bathroom"],
  "Backyard": ["Backyard"],
  "Basement Study": ["Basement Study"],
  "Shed Arc +1": ["Shed Arc","Shed Boombox"],
  "Shed Arc": ["Shed Arc"],
  "Garage": ["Garage"]
};
const DEFAULT_GROUP = { "Vashon": ["Maury","Green Kitchen Move","Sonos Move"], "Cap Hill": ["Living Room","Dining Room","Kitchen"] };

function titleOf(l) {
  const m = l.track.match(/<b>(.*?)<\/b>/);
  return m ? m[1] : (l.track.startsWith("♪") ? "♪" : l.track);
}

function renderHero(sel, mine) {
  if (sel === "Roaming") {
    hero.className = "hero quiet";
    hero.innerHTML = `<span class="hero-state">roaming</span>
      <div class="hero-where">📱 ROAMING</div>
      <div class="hero-track">No speakers here — deep links open Spotify ↗</div>
      <div class="hero-sub">Both homes appear in Elsewhere below.</div>`;
    return;
  }
  const line = mine[0];
  if (!line) {
    hero.className = "hero quiet";
    hero.innerHTML = `<span class="hero-state">quiet</span>
      <div class="hero-where">${sel.toUpperCase()} · ${DEFAULT_GROUP[sel].join(" + ")}</div>
      <div class="hero-track">Nothing playing</div>
      <div class="hero-sub">Pick something from Playlists or Shortcuts ↓</div>`;
  } else if (line.cls === "ew-stale") {
    hero.className = "hero stale";
    hero.innerHTML = `<span class="hero-state">⚠ ${line.rooms}</span>
      <div class="hero-where">${sel.toUpperCase()}</div>
      <div class="hero-track">${line.track}</div>
      <div class="hero-sub">This house's reporter has gone quiet — speakers may still be playing. Sonos app works normally.</div>`;
  } else if (line.cls === "ew-moon") {
    hero.className = "hero moon";
    hero.innerHTML = `<span class="hero-state">🌙 quiet hours</span>
      <div class="hero-where">${sel.toUpperCase()}</div>
      <div class="hero-track">${line.track}</div>`;
  } else {
    const parts = line.track.replace(/<\/?b>/g, "§").split("§");
    const title = parts[1] || line.track, rest = (parts[2] || "").replace(/^ — /, "").replace(/^ · /, "");
    hero.className = "hero playing";
    hero.innerHTML = `<span class="hero-state">▶ playing</span>
      <div class="hero-where">${sel.toUpperCase()} · ${line.rooms}</div>
      <div class="hero-track">${title === "♪ playing" ? "♪ Playing" : title}</div>
      ${rest ? `<div class="hero-artist">${rest}</div>` : ""}
      <div class="hero-controls"><span>⏮</span><span>⏯</span><span>⏭</span><span style="margin-left:auto">🔊 18</span></div>`;
  }
}

function renderHdw(sel, mine) {
  if (sel === "Roaming") { hdw.style.display = "none"; return; }
  hdw.style.display = "block";
  hdw.className = "dw" + (hdwOpen ? " open" : "");
  const line = mine[0] && mine[0].cls === "" ? mine[0] : null;
  const members = line ? (GROUP_MEMBERS[line.rooms] || [line.rooms]) : DEFAULT_GROUP[sel];
  const label = line ? line.rooms : DEFAULT_GROUP[sel].join(" + ");
  const rooms = HOUSE_ROOMS[sel];
  const memberRows = rooms.filter(([r]) => members.includes(r));

  let qsum, qbody;
  if (line && line.queue) {
    qsum = `queue ${line.queue.length}`;
    qbody = line.queue.map((t, i) =>
      `<div class="qrow ${i === 0 ? "now" : ""}"><span class="qn">${i === 0 ? "▶" : i}</span><span>${t}</span></div>`).join("");
  } else if (line && line.stream) {
    qsum = "stream — no queue";
    qbody = `<div class="qempty">Live stream — no queue</div>`;
  } else {
    qsum = "queue: —";
    qbody = `<div class="qempty">Queue — ${label}: —</div>`;
  }

  hdw.innerHTML = `
    <div class="dw-bar" onclick="toggleHdw()">
      <span class="dw-label">🔊 Speakers &amp; Queue</span>
      <span class="dw-sum">${memberRows.length} speaker${memberRows.length > 1 ? "s" : ""} · ${qsum}</span>
      <span class="dw-caret">⌄</span>
    </div>
    <div class="dw-detail">
      <div class="dw-sec">
        <div class="dw-h">Speakers — ${label}</div>
        <div class="chips">${rooms.map(([r]) =>
          `<span class="chip ${members.includes(r) ? "on" : ""}">${r}</span>`).join("")}</div>
        ${memberRows.map(([r, v]) =>
          `<div class="volrow"><span class="vr-name">${r}</span><span class="vr-bar"><span class="vr-fill" style="width:${Math.min(v, 100)}%"></span></span><span class="vr-n">${v}</span></div>`).join("")}
        <div class="nudge"><button>−3</button><button>+3</button><span>group nudge</span><span class="grp">Group Speakers…</span></div>
      </div>
      <div class="dw-sec">
        <div class="dw-h">Queue — ${label}</div>
        ${qbody}
      </div>
    </div>`;
}

function seg(l, sel) {
  const houseTag = l.house === sel ? "" : `${l.house}: `;
  if (l.cls === "ew-stale") return `<span class="seg-warn">⚠ ${l.house} last seen 72m</span>`;
  if (l.cls === "ew-moon") return `<span class="seg-moon">🌙 ${l.house} asleep</span>`;
  const t = titleOf(l);
  return `<span class="seg-play">▶</span> ${houseTag}${l.rooms}${t === "♪" ? "" : ` — <b>${t}</b>`}`;
}

function render(name) {
  currentScenario = name;
  const sc = SCENARIOS[name];
  const sel = selectedHouse();

  let mine = sel === "Roaming" ? [] : sc.lines.filter(l => l.house === sel);
  if (heroPick) {
    const i = mine.findIndex(l => l.rooms === heroPick);
    if (i > 0) mine = [mine[i], ...mine.slice(0, i), ...mine.slice(i + 1)];
  }
  const elsewhere = [...mine.slice(1), ...sc.lines.filter(l => l.house !== sel)];

  renderHero(sel, mine);
  renderHdw(sel, mine);

  if (elsewhere.length === 0) {
    elw.style.display = "none";
  } else {
    elw.style.display = "block";
    elw.className = "dw" + (elwOpen ? " open" : "");
    elw.innerHTML = `
      <div class="dw-bar" onclick="toggleElw()">
        <span class="dw-label">Elsewhere</span>
        <span class="dw-sum">${elsewhere.map(l => seg(l, sel)).join(" &nbsp;·&nbsp; ")}</span>
        <span class="dw-caret">⌄</span>
      </div>
      <div class="dw-detail">${elsewhere.map(l => `
        <div class="ew-line ${l.cls}" ${l.cls === "" ? `onclick="pickGroup('${l.house}','${l.rooms}')"` : ""}>
          <span class="ew-icon ${l.cls ? "" : "ew-play"}">${l.icon}</span>
          <span class="ew-main">
            <span class="ew-where"><span class="house">${l.house}</span> · ${l.rooms}</span>
            ${l.track ? `<div class="ew-track">${l.track}</div>` : ""}
          </span>
          <span class="ew-go">${l.go}</span>
        </div>`).join("")}
      </div>`;
  }

  const live = elsewhere.some(l => l.icon === "▶");
  housesel.classList.toggle("other-playing", live);

  note.textContent = sc.note + `\n\nViewing: ${sel}. Two independent drawers, both collapsed by default: 🔊 Speakers & Queue = YOUR group (chips, per-room volumes, group nudge, this group's queue — honest — when unknown). Elsewhere = every other group; tap a live row → adopt that house+group as your active selection (audio untouched). ⚠/🌙 rows aren't selectable.`;
  [...btns.children].forEach(b => b.classList.toggle("active", b.textContent === name));
}

function toggleElw() { elwOpen = !elwOpen; render(currentScenario); }
function toggleHdw() { hdwOpen = !hdwOpen; render(currentScenario); }
housesel.onchange = () => render(currentScenario);

Object.keys(SCENARIOS).forEach(name => {
  const b = document.createElement("button");
  b.textContent = name;
  b.onclick = () => render(name);
  btns.appendChild(b);
});
render("Both houses, multi-zone");
</script>
</body>
</html>

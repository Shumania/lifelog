<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session History — Pass 2</title>
<style>
:root {
  --bg: #0f1115; --panel: #1a1d24; --panel2: #20242e; --border: #2a2f3a;
  --text: #e3e6ec; --dim: #8b93a3; --dim2: #62697a;
  --accent: #2dd4bf; --accent-ink: #06201d; --gold: #f0b940; --chip: #232936;
  --radius: 12px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14.5px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding-bottom: 60px; }
header { position: sticky; top: 0; z-index: 20; background: rgba(15,17,21,.96); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 10px 14px 8px; }
header h1 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
header h1 small { color: var(--dim); font-weight: 400; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { background: var(--chip); color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 5px 13px; font-size: 12.5px; cursor: pointer; }
.tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.caption { margin-top: 6px; font-size: 12px; color: var(--dim); font-style: italic; }
main { max-width: 620px; margin: 0 auto; padding: 6px 10px 40px; }
.dayhdr { margin: 20px 2px 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim2); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.dayhdr:first-child { margin-top: 10px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); padding: 8px 18px; border-radius: 20px; font-weight: 700; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 99; white-space: nowrap; }
.toast.show { opacity: 1; }

/* ---------- art / placeholder ---------- */
.art, .art-ph { border-radius: 6px; object-fit: cover; display: block; flex: 0 0 auto; }
.art-ph { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; letter-spacing: .02em; }

/* ---------- badges ---------- */
.b-expl { color: var(--gold); font-size: 12px; cursor: help; margin-left: 4px; }
.b-demo { display: inline-block; background: var(--gold); color: #241a00; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; border-radius: 8px; padding: 1px 7px; margin-left: 6px; vertical-align: middle; }

/* ---------- pill buttons ---------- */
.pillbar { display: flex; gap: 5px; }
.pill { background: var(--chip); border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 3px 8px; font-size: 12px; cursor: pointer; line-height: 1.2; }
.pill:active { background: var(--accent); color: var(--accent-ink); }
.pill.chev { color: var(--dim); }

/* ---------- Tier 1: one line ---------- */
.t1 { display: flex; align-items: center; gap: 8px; padding: 6px 4px; cursor: pointer; border-radius: 8px; }
.t1:hover { background: var(--panel); }
.t1 .thumb18 { width: 18px; height: 18px; border-radius: 4px; font-size: 8px; }
.t1 .time { flex: 0 0 auto; width: 58px; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.t1 .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t1 .txt b { font-weight: 700; }
.t1 .n { flex: 0 0 auto; font-size: 11px; color: var(--dim2); }

/* ---------- Tier 2: compact card ---------- */
.t2 { display: flex; gap: 10px; align-items: center; padding: 8px 8px; margin: 4px 0; border-radius: var(--radius); cursor: pointer; background: var(--panel); border: 1px solid var(--border); }
.t2:hover { background: var(--panel2); }
.t2 .thumb40 { width: 40px; height: 40px; border-radius: 7px; font-size: 13px; }
.t2 .thumb56 { width: 56px; height: 56px; border-radius: 8px; font-size: 16px; }
.t2 .main { flex: 1; min-width: 0; }
.t2 .top { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--dim); }
.t2 .title { margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.t2 .title b { font-weight: 700; }
.t2 .sub { font-size: 12px; color: var(--dim); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t2 .chev { flex: 0 0 auto; color: var(--dim2); font-size: 13px; }

/* ---------- Tier 3: rich card ---------- */
.t3 { padding: 12px; margin: 8px 0; border-radius: 14px; cursor: pointer; background: var(--panel); border: 1px solid var(--border); }
.t3:hover { background: var(--panel2); }
.t3 .top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
.t3 .body { display: flex; gap: 12px; align-items: flex-start; }
.t3 .title { font-size: 15.5px; }
.t3 .title b { font-weight: 700; }
.t3 .sub { font-size: 12.5px; color: var(--dim); margin-top: 3px; }
.t3 .chev { color: var(--dim2); font-size: 13px; margin-top: 4px; }
.t3 .textblock { flex: 1; min-width: 0; }

/* stack right (Variant D T3) */
.stack { flex: 0 0 auto; position: relative; width: 74px; height: 54px; }
.stack .art, .stack .art-ph { width: 44px; height: 44px; position: absolute; border: 2px solid var(--panel); }
.stack .s0 { left: 26px; top: 0; z-index: 3; }
.stack .s1 { left: 13px; top: 6px; z-index: 2; filter: brightness(.78); }
.stack .s2 { left: 0; top: 12px; z-index: 1; filter: brightness(.58); }

/* 2x2 grid (Variant E T3, left side) */
.grid2 { flex: 0 0 auto; width: 76px; height: 76px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; }
.grid2 .art, .grid2 .art-ph { width: 100%; height: 100%; border-radius: 4px; font-size: 10px; }

/* inline cluster (Variant F T3, in header row) */
.cluster { display: flex; margin-left: 8px; }
.cluster .art, .cluster .art-ph { width: 22px; height: 22px; border-radius: 5px; margin-left: -8px; border: 1.5px solid var(--panel); font-size: 8px; }
.cluster .art:first-child, .cluster .art-ph:first-child { margin-left: 0; }
.muted { color: var(--dim); font-weight: 400; }

/* radio / station card */
.station { padding: 12px; margin: 8px 0; border-radius: 14px; cursor: pointer; background: linear-gradient(135deg,#1a2430,#1a1d24); border: 1px solid #2f4c52; }
.station:hover { background: linear-gradient(135deg,#1e2a38,#20242e); }
.station .top { display:flex; align-items:center; gap:8px; font-size: 13px; color: var(--dim); }
.station .name { font-size: 16px; font-weight: 700; margin-top: 4px; }
.station .sub { font-size: 12.5px; color: var(--dim); margin-top: 3px; }
.station .chev { margin-top: 6px; color: var(--dim2); font-size: 13px; }

/* ---------- expansion: entities ---------- */
.entities { display: none; padding: 8px 2px 2px 4px; border-top: 1px dashed var(--border); margin-top: 8px; }
.entities.open { display: block; }
.entcard { display: flex; gap: 10px; align-items: center; background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin: 6px 0; cursor: pointer; }
.entcard .art, .entcard .art-ph { width: 46px; height: 46px; border-radius: 7px; font-size: 15px; }
.entcard .meta { flex: 1; min-width: 0; }
.entcard .nm { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entcard .ar { font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.entcard .btns { display: flex; gap: 5px; margin-top: 6px; }
.entcard .chev { flex: 0 0 auto; color: var(--dim2); font-size: 13px; }

/* ---------- expansion: track rows ---------- */
.trackrows { display: none; padding: 4px 0 2px 8px; }
.trackrows.open { display: block; }
.trk { display: flex; gap: 8px; align-items: center; padding: 4px 2px; font-size: 12.5px; color: var(--dim); border-bottom: 1px solid #1b1f28; }
.trk:last-child { border-bottom: none; }
.trk .tm { flex: 0 0 52px; font-variant-numeric: tabular-nums; }
.trk .tt { flex: 1; min-width: 0; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trk .ta { flex: 0 0 auto; max-width: 34%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trk .btns { display: flex; gap: 4px; flex: 0 0 auto; }
.trk .pill { padding: 2px 6px; font-size: 11px; }

@media (max-width: 420px) {
  .t1 .time { width: 50px; }
  .trk .ta { display: none; }
}
</style>
</head>

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function fday(t) { return new Date(t).toLocaleDateString('en-US', { timeZone: TZ, weekday: 'long', month: 'short', day: 'numeric' }); }
function dkey(t) { return new Date(t).toLocaleDateString('en-CA', { timeZone: TZ }); }
function fdur(ms) { const m = Math.round(ms / 60000); if (m < 60) return m + ' min'; const h = Math.floor(m / 60), r = m % 60; return h + 'h' + (r ? ' ' + r + 'm' : ''); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._h); toast._h = setTimeout(() => t.classList.remove('show'), 1400); }

function queueStub(kind, name) { toast('＋ queued ' + kind + (name ? ': ' + name : '')); }

function initials(str) {
  const words = String(str || '?').replace(/[^\w\s]/g, ' ').trim().split(/\s+/).filter(Boolean);
  if (!words.length) return '?';
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}
function hashHue(str) { let h = 0; const s = String(str || ''); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h % 360; }
function artOrPh(art, label, cls) {
  if (art) return `<img class="art ${cls}" src="${esc(art)}" loading="lazy" alt="">`;
  const h = hashHue(label);
  return `<div class="art-ph ${cls}" style="background:linear-gradient(135deg, hsl(${h},55%,32%), hsl(${(h + 45) % 360},55%,20%))">${esc(initials(label))}</div>`;
}

/* ---------------- tier logic ---------------- */
function tierOf(s) {
  if (s.isRadio) return 3;
  let t = s.n <= 3 ? 1 : (s.n <= 12 ? 2 : 3);
  if (t === 2 && (s.end - s.start) > 70 * 60 * 1000) t = 3; // album-shaped long run promotes
  return t;
}

/* ---------------- title / headline logic ---------------- */
function titleFor(s) {
  const albums = [...s.albums].sort((a, b) => b.n - a.n);
  const top = albums[0];
  if (top && s.n > 1 && top.n / s.n >= 0.7) {
    return { kind: 'album', title: top.album, sub: `${esc(top.artist)}${top.year ? ' · ' + top.year : ''}${top.total ? ` · ${top.n}/${top.total} trk` : ''}`, art: top.art, artLabel: top.album };
  }
  const ctxs = s.contexts.filter(c => c.n).sort((a, b) => b.n - a.n);
  const topc = ctxs[0];
  if (topc && s.n > 1 && topc.n / s.n >= 0.5) {
    return { kind: 'playlist', title: topc.name || 'Mixed session', sub: `playlist · ${topc.n} track${topc.n > 1 ? 's' : ''}`, art: topc.art, artLabel: topc.name || 'Mixed session' };
  }
  const arts = s.artists;
  const dom = arts[0];
  if (arts.length === 1) {
    return { kind: 'artist', title: dom[0], sub: `${s.n} track${s.n > 1 ? 's' : ''}`, art: top ? top.art : null, artLabel: dom[0] };
  }
  const domShare = dom[1] / s.n;
  if (domShare >= 0.45) {
    return { kind: 'ledby', title: `${dom[0]} <span class="muted">+ various</span>`, plain: `${dom[0]} + various`, sub: `${arts.length} artists · ${s.n} tracks`, art: top ? top.art : null, artLabel: dom[0] };
  }
  return { kind: 'ledby', title: `led by <b>${esc(dom[0])}</b>`, plain: `led by ${dom[0]}`, sub: `${arts.length} artists · ${s.n} tracks`, art: top ? top.art : null, artLabel: dom[0] };
}

function oneLiner(s) {
  const dom = s.artists[0][0];
  const track = s.tracks.find(t => t.artist === dom) || s.tracks[0];
  let extra = '';
  if (s.n > 1) {
    const rest = s.n - 1;
    const multi = s.artists.length > 1;
    extra = ` <span class="muted">＋${rest}${multi ? ' · various' : ''}</span>`;
  }
  return { artist: dom, title: track.title, extra };
}

/* ---------------- entities (level 1) ---------------- */
function sessionEntities(s) {
  const out = [];
  for (const a of s.albums) {
    out.push({ type: 'album', key: 'a:' + a.album + '|' + a.artist, title: a.album, sub: `${a.artist}${a.year ? ' · ' + a.year : ''}${a.total ? ` · ${a.n}/${a.total} trk` : ` · ${a.n} trk`}`, art: a.art, n: a.n, match: a });
  }
  for (const c of s.contexts.filter(c => c.name)) {
    out.push({ type: 'playlist', key: 'p:' + c.uri, title: c.name, sub: `playlist · ${c.n} track${c.n > 1 ? 's' : ''}`, art: c.art, n: c.n, match: c });
  }
  out.sort((a, b) => b.n - a.n);
  return out;
}
function entityTracks(entity, s) {
  if (entity.type === 'album') {
    let tr = s.tracks.filter(t => t.album === entity.match.album && t.artist === entity.match.artist);
    if (!tr.length) tr = s.tracks.filter(t => t.album === entity.match.album);
    return tr;
  }
  return s.tracks.slice();
}

/* ---------------- persisted accordion state ---------------- */
const STATE_KEY = 'shv2_state_v1';
let STATE = { sess: {}, ent: {} };
try { const raw = sessionStorage.getItem(STATE_KEY); if (raw) STATE = JSON.parse(raw); } catch (e) {}
function saveState() { try { sessionStorage.setItem(STATE_KEY, JSON.stringify(STATE)); } catch (e) {} }
function toggleSession(sid, ev) {
  if (ev) ev.stopPropagation();
  STATE.sess[sid] = !STATE.sess[sid];
  saveState();
  const el = document.getElementById('ent-' + sid);
  if (el) el.classList.toggle('open', !!STATE.sess[sid]);
}
function toggleEntity(sid, ekey, ev) {
  if (ev) ev.stopPropagation();
  const k = sid + ':' + ekey;
  STATE.ent[k] = !STATE.ent[k];
  saveState();
  const el = document.getElementById('trk-' + sid + '-' + cssSafe(ekey));
  if (el) el.classList.toggle('open', !!STATE.ent[k]);
}
function cssSafe(k) { return k.replace(/[^a-zA-Z0-9]/g, '_'); }

/* ---------------- shared markup builders ---------------- */
function trackRowHtml(t) {
  return `<div class="trk">
    <span class="tm">${ftime(t.ts)}</span>
    <span class="tt">${esc(t.title)}</span>
    <span class="ta">${esc(t.artist)}</span>
    <span class="btns">
      <button class="pill" onclick="event.stopPropagation(); playStub('track','${esc(t.title)}')">▶</button>
      <button class="pill" onclick="event.stopPropagation(); queueStub('track','${esc(t.title)}')">＋</button>
    </span>
  </div>`;
}
function entityCardHtml(s, ent, sid) {
  const ekey = ent.key, safeKey = cssSafe(ekey);
  const open = !!STATE.ent[sid + ':' + ekey];
  const rows = entityTracks(ent, s).map(trackRowHtml).join('');
  return `<div class="entcard" onclick="toggleEntity(${sid}, '${esc(ekey)}', event)">
      ${artOrPh(ent.art, ent.artLabel || ent.title, '')}
      <div class="meta">
        <div class="nm">${ent.type === 'playlist' ? '🎧 ' : ''}${esc(ent.title)}</div>
        <div class="ar">${esc(ent.sub)}</div>
        <div class="btns">
          <button class="pill" onclick="event.stopPropagation(); playStub('${ent.type}','${esc(ent.title)}')">▶ Play</button>
          <button class="pill" onclick="event.stopPropagation(); queueStub('${ent.type}','${esc(ent.title)}')">＋ Queue</button>
        </div>
      </div>
      <div class="chev">▾</div>
    </div>
    <div class="trackrows ${open ? 'open' : ''}" id="trk-${sid}-${safeKey}">${rows}</div>`;
}
function entitiesBlockHtml(s, sid) {
  if (s.isRadio) {
    const rows = s.tracks.map(trackRowHtml).join('');
    return `<div class="entities ${STATE.sess[sid] ? 'open' : ''}" id="ent-${sid}"><div class="trackrows open">${rows}</div></div>`;
  }
  const ents = sessionEntities(s);
  const open = !!STATE.sess[sid];
  return `<div class="entities ${open ? 'open' : ''}" id="ent-${sid}">${ents.map(e => entityCardHtml(s, e, sid)).join('')}</div>`;
}
function explBadge(s) {
  if (!s.explorations || !s.explorations.length) return '';
  const tip = s.explorations.map(e => e.artist).join(', ');
  return `<span class="b-expl" title="Related exploration: ${esc(tip)}">✨</span>`;
}
function demoBadge(s) { return s.isRadio ? '<span class="b-demo">demo data</span>' : ''; }

/* ---------------- tier renderers (shared across variants, thumb size configurable) ---------------- */
function renderT1(s, sid, thumb) {
  const o = oneLiner(s);
  const thumbHtml = thumb ? artOrPh(null, o.artist, 'thumb18') : '';
  // use dominant album art if available for the micro-thumb
  const albums = [...s.albums].sort((a, b) => b.n - a.n);
  const art = albums[0] ? albums[0].art : null;
  const thumbFinal = thumb ? artOrPh(art, o.artist, 'thumb18') : '';
  return `<div class="t1" onclick="toggleSession(${sid})">
      ${thumbFinal}
      <span class="time">${ftime(s.start)}</span>
      <span class="txt"><b>${esc(o.artist)}</b> — ${esc(o.title)}${o.extra}</span>
      ${explBadge(s)}
      <span class="n">${s.n}</span>
    </div>
    ${entitiesBlockHtml(s, sid)}`;
}
function renderT2(s, sid, thumbSize) {
  const h = titleFor(s);
  const thumbCls = thumbSize === 56 ? 'thumb56' : 'thumb40';
  return `<div class="t2" onclick="toggleSession(${sid})">
      ${artOrPh(h.art, h.artLabel, thumbCls)}
      <div class="main">
        <div class="top"><span>${ftime(s.start)}</span><span>${s.n} tracks</span></div>
        <div class="title">${h.title.startsWith ? (h.kind === 'album' ? `<b>${esc(h.title)}</b>` : h.title) : h.title}</div>
        <div class="sub">${h.sub}${s.explorations.length ? ' ' : ''}${explBadge(s)}</div>
      </div>
      <div class="chev">▾</div>
    </div>
    ${entitiesBlockHtml(s, sid)}`;
}
function renderT3(s, sid, style) {
  const h = titleFor(s);
  const albums = [...s.albums].filter(a => a.art).slice(0, 4);
  const dur = fdur(s.end - s.start);
  let artHtml = '';
  if (style === 'stackRight') {
    let stack = '';
    for (let i = 0; i < 3; i++) {
      const a = albums[i];
      stack += a ? `<img class="art s${i}" src="${esc(a.art)}" loading="lazy" alt="">` : (i === 0 ? artOrPh(null, h.artLabel, 's0') : '');
    }
    artHtml = `<div class="stack">${stack}</div>`;
  } else if (style === 'grid2x2') {
    let cells = '';
    for (let i = 0; i < 4; i++) {
      const a = albums[i];
      cells += a ? `<img class="art" src="${esc(a.art)}" loading="lazy" alt="">` : (i === 0 ? artOrPh(h.art, h.artLabel, '') : `<div class="art-ph" style="background:var(--chip)"></div>`);
    }
    artHtml = `<div class="grid2">${cells}</div>`;
  }
  const titleHtml = h.kind === 'ledby' ? h.title : `<b>${esc(h.title)}</b>`;
  let clusterHtml = '';
  if (style === 'inlineCluster') {
    let c = '';
    for (let i = 0; i < Math.min(3, albums.length); i++) c += `<img class="art" src="${esc(albums[i].art)}" loading="lazy" alt="">`;
    if (!albums.length) c = artOrPh(h.art, h.artLabel, '');
    clusterHtml = `<span class="cluster">${c}</span>`;
  }
  const body = style === 'inlineCluster'
    ? `<div class="textblock">
        <div class="title">${titleHtml}${clusterHtml}</div>
        <div class="sub">${h.sub}</div>
      </div>`
    : `${artHtml}<div class="textblock"><div class="title">${titleHtml}</div><div class="sub">${h.sub}</div></div>`;
  return `<div class="t3" onclick="toggleSession(${sid})">
      <div class="top"><span>${ftime(s.start)} · ${dur}</span><span>${explBadge(s)} ${s.n} tracks ▾</span></div>
      <div class="body">${body}</div>
    </div>
    ${entitiesBlockHtml(s, sid)}`;
}
function renderStation(s, sid) {
  return `<div class="station" onclick="toggleSession(${sid})">
      <div class="top"><span>📻 ${esc(s.stationName)} · ${esc(s.stationFreq)}</span>${demoBadge(s)}</div>
      <div class="name">${ftime(s.start)} · ${fdur(s.end - s.start)} live radio</div>
      <div class="sub">${s.n} tracks aired ${explBadge(s)}</div>
      <div class="chev">▾ tracks</div>
    </div>
    ${entitiesBlockHtml(s, sid)}`;
}

/* ---------------- variant configs ---------------- */
const VCFG = {
  D: { t1Thumb: false, t2Thumb: 40, t3Style: 'stackRight' },
  E: { t1Thumb: true, t2Thumb: 56, t3Style: 'grid2x2' },
  F: { t1Thumb: false, t2Thumb: 56, t3Style: 'inlineCluster' },
};

function renderSession(s, cfg) {
  const sid = s.__id;
  if (s.isRadio) return renderStation(s, sid);
  const tier = tierOf(s);
  if (tier === 1) return renderT1(s, sid, cfg.t1Thumb);
  if (tier === 2) return renderT2(s, sid, cfg.t2Thumb);
  return renderT3(s, sid, cfg.t3Style);
}

function groupByDay(sessions) {
  const days = new Map();
  for (const s of sessions) {
    const k = dkey(s.start);
    if (!days.has(k)) days.set(k, []);
    days.get(k).push(s);
  }
  return days;
}

let VARIANT = 'D';
function setVariant(v) {
  VARIANT = v;
  for (const x of ['D', 'E', 'F']) document.getElementById('tab' + x).classList.toggle('on', x === v);
  document.getElementById('caption').textContent = CAPTIONS[v];
  render();
}
function render() {
  const cfg = VCFG[VARIANT];
  const days = groupByDay(ALL_SESSIONS);
  let out = '';
  for (const [k, ss] of days) {
    out += `<div class="dayhdr">${fday(ss[0].start)}</div>`;
    for (const s of ss) out += renderSession(s, cfg);
  }
  document.getElementById('main').innerHTML = out;
}

/* ---------------- demo radio session ---------------- */
function buildDemoRadioSession(anchorStart) {
  const tracklist = [
    ['Feeling Good (KEXP Session)', 'Michael Kiwanuka'], ['Silver Springs', 'Say She She'],
    ['Nxst2u', 'Little Simz'], ['Free', 'Faye Webster'], ['Automatic', 'Miguel Migs'],
    ['B.O.T.A. (Baddest Of Them All)', 'Eliza Rose'], ['Alright', 'Jitwam'],
    ['Water No Get Enemy', 'Fela Kuti'], ['Karma', 'Tems'], ['Sunny Ade', 'King Sunny Adé'],
    ['Machu Picchu', 'The Strokes'], ['Silhouettes', 'Of Monsters and Men'],
    ['Weightless', 'Washed Out'], ['Bags', 'Clairo'], ['Silver Lining', 'Wet Leg'],
    ['Aya', 'Obongjayar'], ['Cola', 'CAMP TRASH'], ['Passionfruit', 'Drake (KEXP edit)'],
    ['Two Weeks', 'FKA twigs'], ['Nightcall', 'Kavinsky'], ['Ferrari', 'James Hype'],
    ['Anti-Hero', 'Course of Empire'], ['Roll the Dice', 'Khruangbin'], ['Dreams', 'Fleetwood Mac (live)']
  ];
  const start = anchorStart + 4 * 3600 * 1000; // later same evening
  const dur = 2 * 3600 * 1000 + 6 * 60 * 1000;
  const end = start + dur;
  const gap = dur / tracklist.length;
  const tracks = tracklist.map((t, i) => ({ ts: Math.round(start + i * gap), title: t[0], artist: t[1], album: null, dur: 210 }));
  const artistCounts = new Map();
  for (const t of tracks) artistCounts.set(t.artist, (artistCounts.get(t.artist) || 0) + 1);
  return {
    locus: 'roaming', start, end, rooms: [], n: tracks.length,
    artists: [...artistCounts.entries()].sort((a, b) => b[1] - a[1]),
    albums: [], contexts: [], explorations: [], tracks,
    isRadio: true, stationName: 'KEXP', stationFreq: '90.3 Seattle', demo: true,
  };
}

let ALL_SESSIONS = [];
function init() {
  ALL_SESSIONS = SESSIONS.slice();
  const maxStart = Math.max(...ALL_SESSIONS.map(s => s.start));
  ALL_SESSIONS.push(buildDemoRadioSession(maxStart));
  ALL_SESSIONS.sort((a, b) => b.start - a.start);
  ALL_SESSIONS.forEach((s, i) => { s.__id = i; });
  setVariant('D');
}
init();
</script>
